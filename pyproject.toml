[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidahelp"
version = "0.1.0"
description = "面向企业客服场景的可观测、可评测 Agent Demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncmy>=0.2.9,<1.0",
    "fastapi>=0.115,<1.0",
    "jsonschema>=4.23,<5.0",
    "langgraph>=0.2,<2.0",
    "langgraph-checkpoint-sqlite>=2.0,<4.0",
    "mcp>=1.28,<2.0",
    "openpyxl>=3.1,<4.0",
    "pydantic-settings>=2.4,<3.0",
    "pymilvus>=2.6,<3.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
    "PyJWT>=2.9,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
asyncio_mode = "auto"
markers = [
    "integration: 需要真实基础设施的集成测试",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
