[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# The real URL is loaded from AIDAHELP_DATABASE_URL in migrations/env.py.
sqlalchemy.url = mysql+asyncmy://aidahelp:aidahelp@127.0.0.1:3307/aidahelp

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
