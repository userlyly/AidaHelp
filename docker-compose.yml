services:
  mysql:
    image: mysql:8.4
    container_name: aidahelp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aidahelp
      MYSQL_USER: aidahelp
      MYSQL_PASSWORD: aidahelp
      MYSQL_ROOT_PASSWORD: root-aidahelp
      TZ: Asia/Shanghai
    ports:
      # 主机使用 3307，容器内部仍是标准的 3306。
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uaidahelp -paidahelp --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - aidahelp_mysql_data:/var/lib/mysql

  # Milvus Standalone 才能使用阶段 5 所需的原生 BM25 全文检索。
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: aidahelp-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - aidahelp_milvus_etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: aidahelp-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - aidahelp_milvus_minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.6.22
    container_name: aidahelp-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - aidahelp_milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5

volumes:
  aidahelp_mysql_data:
  aidahelp_milvus_etcd:
  aidahelp_milvus_minio:
  aidahelp_milvus_data:
